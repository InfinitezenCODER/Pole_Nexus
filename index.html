<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pole Nexus — AI-Powered NSC Decision Support</title>
<style>
  :root {
    --navy: #0a1628;
    --navy-light: #132038;
    --navy-mid: #1a2d4a;
    --blue: #2563eb;
    --blue-light: #3b82f6;
    --blue-pale: #dbeafe;
    --green: #059669;
    --green-light: #d1fae5;
    --green-bg: #ecfdf5;
    --amber: #d97706;
    --amber-light: #fef3c7;
    --red: #dc2626;
    --red-light: #fee2e2;
    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-300: #cbd5e1;
    --gray-400: #94a3b8;
    --gray-500: #64748b;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-800: #1e293b;
    --gray-900: #0f172a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
    --shadow-lg: 0 10px 15px rgba(0,0,0,.1), 0 4px 6px rgba(0,0,0,.05);
    --radius: 10px;
    --radius-lg: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--gray-100);
    color: var(--gray-800);
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* HEADER */
  .app-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-mid));
    color: white;
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }

  .header-left { display: flex; align-items: center; gap: 16px; }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -.3px;
  }

  .logo-icon {
    width: 34px; height: 34px;
    background: var(--blue);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .header-subtitle {
    font-size: 12px;
    color: var(--gray-400);
    border-left: 1px solid var(--gray-600);
    padding-left: 16px;
    letter-spacing: .3px;
  }

  .header-right { display: flex; align-items: center; gap: 16px; }

  .demo-badge {
    background: var(--amber);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: .5px;
    cursor: pointer;
  }

  .area-badge {
    background: rgba(255,255,255,.12);
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 13px;
    display: flex; align-items: center; gap: 6px;
  }

  .user-profile {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
  }

  .user-avatar {
    width: 32px; height: 32px;
    background: var(--blue);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
    font-size: 13px;
  }

  /* LAYOUT */
  .app-layout { display: flex; min-height: calc(100vh - 60px); }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    background: white;
    border-right: 1px solid var(--gray-200);
    padding: 16px 0;
    flex-shrink: 0;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    font-size: 14px;
    color: var(--gray-600);
    cursor: pointer;
    transition: all .15s;
    border-left: 3px solid transparent;
  }

  .nav-item:hover { background: var(--gray-50); color: var(--gray-800); }
  .nav-item.active {
    background: var(--blue-pale);
    color: var(--blue);
    font-weight: 600;
    border-left-color: var(--blue);
  }

  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .nav-divider { height: 1px; background: var(--gray-200); margin: 12px 16px; }

  /* MAIN */
  .main-content {
    flex: 1;
    padding: 24px;
    max-width: 1200px;
    overflow-y: auto;
  }

  /* CARDS */
  .card {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    border: 1px solid var(--gray-200);
    overflow: hidden;
  }

  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-header h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--gray-800);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-body { padding: 20px; }

  /* BUTTONS */
  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all .15s;
    letter-spacing: -.1px;
  }

  .btn-primary { background: var(--blue); color: white; }
  .btn-primary:hover { background: var(--blue-light); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-success { background: var(--green); color: white; }
  .btn-success:hover { opacity: .9; }
  .btn-outline { background: white; color: var(--gray-700); border: 1px solid var(--gray-300); }
  .btn-outline:hover { background: var(--gray-50); }
  .btn-lg { padding: 14px 28px; font-size: 15px; border-radius: 10px; }
  .btn-sm { padding: 6px 14px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }

  .stat-card {
    background: white;
    border-radius: var(--radius);
    padding: 18px;
    border: 1px solid var(--gray-200);
    box-shadow: var(--shadow-sm);
  }

  .stat-label {
    font-size: 12px;
    color: var(--gray-500);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 26px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -.5px;
  }

  .stat-sub {
    font-size: 12px;
    color: var(--green);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* BADGE */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-green { background: var(--green-light); color: var(--green); }
  .badge-amber { background: var(--amber-light); color: var(--amber); }
  .badge-red { background: var(--red-light); color: var(--red); }
  .badge-blue { background: var(--blue-pale); color: var(--blue); }

  /* TABLE */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .data-table th {
    text-align: left;
    padding: 10px 14px;
    background: var(--gray-50);
    color: var(--gray-600);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    border-bottom: 1px solid var(--gray-200);
  }

  .data-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--gray-100);
    color: var(--gray-700);
  }

  .data-table tr:hover td { background: var(--gray-50); }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-700);
    margin-bottom: 5px;
  }

  .form-input, .form-select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--gray-300);
    border-radius: 7px;
    font-size: 14px;
    color: var(--gray-800);
    background: white;
    transition: border-color .15s;
  }

  .form-input:focus, .form-select:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  }

  /* PROGRESS STEPS */
  .step-progress {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 24px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .step-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--gray-400);
    white-space: nowrap;
    position: relative;
  }

  .step-item.active { color: var(--blue); }
  .step-item.done { color: var(--green); }

  .step-num {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--gray-200);
    color: var(--gray-500);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .step-item.active .step-num { background: var(--blue); color: white; }
  .step-item.done .step-num { background: var(--green); color: white; }

  .step-arrow { color: var(--gray-300); font-size: 14px; margin: 0 2px; }

  /* UPLOAD ZONE */
  .upload-zone {
    border: 2px dashed var(--gray-300);
    border-radius: var(--radius-lg);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    background: var(--gray-50);
  }

  .upload-zone:hover { border-color: var(--blue); background: var(--blue-pale); }

  .upload-zone .icon {
    font-size: 40px;
    color: var(--gray-400);
    margin-bottom: 12px;
  }

  .upload-zone h4 { color: var(--gray-700); margin-bottom: 4px; }
  .upload-zone p { font-size: 13px; color: var(--gray-500); }

  /* PHOTO ANALYSIS */
  .photo-container {
    position: relative;
    display: inline-block;
    max-width: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    background: #000;
  }

  .photo-container canvas {
    display: block;
    max-width: 100%;
    border-radius: var(--radius);
  }

  /* PROCESSING STEPS */
  .process-steps { list-style: none; }

  .process-step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    font-size: 14px;
    color: var(--gray-500);
  }

  .process-step.done { color: var(--green); }
  .process-step.active { color: var(--blue); }

  .process-step .icon { width: 20px; text-align: center; }

  /* SCORE BAR */
  .score-bar-container { display: flex; align-items: center; gap: 10px; }

  .score-bar {
    flex: 1;
    height: 8px;
    background: var(--gray-200);
    border-radius: 4px;
    overflow: hidden;
  }

  .score-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width .8s ease;
  }

  .score-value { font-weight: 700; font-size: 14px; min-width: 36px; }

  /* MAP */
  .map-container {
    height: 350px;
    background: #e8ecf2;
    border-radius: var(--radius);
    position: relative;
    overflow: hidden;
    border: 1px solid var(--gray-200);
  }

  .map-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(148,163,184,.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.15) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  .map-road {
    position: absolute;
    background: rgba(148,163,184,.25);
  }

  .map-marker {
    position: absolute;
    transform: translate(-50%, -100%);
    cursor: pointer;
    z-index: 10;
    transition: transform .15s;
  }

  .map-marker:hover { transform: translate(-50%, -100%) scale(1.15); }

  .map-marker-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: var(--shadow-md);
    position: relative;
  }

  .map-marker-dot::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 6px solid white;
  }

  .map-marker-label {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy);
    color: white;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: var(--shadow);
  }

  .map-legend {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: white;
    padding: 10px 14px;
    border-radius: 8px;
    box-shadow: var(--shadow-md);
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* CHAIN */
  .chain-flow {
    display: flex;
    align-items: center;
    gap: 0;
    overflow-x: auto;
    padding: 12px 0;
  }

  .chain-node {
    background: white;
    border: 2px solid var(--blue);
    border-radius: 10px;
    padding: 12px 18px;
    text-align: center;
    min-width: 120px;
    flex-shrink: 0;
  }

  .chain-node .label { font-size: 10px; color: var(--gray-500); text-transform: uppercase; letter-spacing: .5px; }
  .chain-node .value { font-size: 14px; font-weight: 700; color: var(--navy); margin-top: 2px; }
  .chain-arrow { font-size: 20px; color: var(--blue); margin: 0 4px; flex-shrink: 0; }

  /* FEASIBILITY */
  .feasibility-result {
    text-align: center;
    padding: 32px;
  }

  .feasibility-icon { font-size: 56px; margin-bottom: 8px; }
  .feasibility-label { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .feasibility-note { font-size: 13px; color: var(--gray-500); margin-top: 8px; font-style: italic; }

  .check-list { list-style: none; }
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--gray-100);
    font-size: 14px;
  }

  .check-icon { font-size: 16px; margin-top: 1px; flex-shrink: 0; }

  /* PAGE TITLES */
  .page-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 4px;
    letter-spacing: -.3px;
  }

  .page-subtitle { font-size: 14px; color: var(--gray-500); margin-bottom: 20px; }

  /* GRID */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

  @media (max-width: 900px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }

  .mb-16 { margin-bottom: 16px; }
  .mb-20 { margin-bottom: 20px; }
  .mb-24 { margin-bottom: 24px; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
  .gap-16 { gap: 16px; }
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .text-center { text-align: center; }

  /* FADE IN */
  .fade-in {
    animation: fadeIn .4s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 18px; height: 18px;
    border: 2.5px solid var(--gray-300);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .6s linear infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  .pulse { animation: pulse 1.2s ease infinite; }

  /* DETECTION BOX OVERLAY */
  .detection-overlay {
    position: absolute;
    border: 2px solid;
    border-radius: 4px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }

  .detection-label {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    color: white;
    position: absolute;
    top: -18px;
    left: -2px;
    border-radius: 3px 3px 0 0;
    white-space: nowrap;
  }

  /* HERO CTA */
  .hero-cta {
    background: linear-gradient(135deg, var(--navy), var(--navy-mid));
    border-radius: var(--radius-lg);
    padding: 36px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    box-shadow: var(--shadow-lg);
  }

  .hero-cta h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .hero-cta p { color: var(--gray-400); font-size: 14px; }

  /* POLE CARD */
  .pole-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .pole-info-item {
    padding: 12px;
    background: var(--gray-50);
    border-radius: 8px;
    border: 1px solid var(--gray-100);
  }

  .pole-info-item .label { font-size: 11px; color: var(--gray-500); text-transform: uppercase; letter-spacing: .5px; }
  .pole-info-item .value { font-size: 16px; font-weight: 700; color: var(--navy); margin-top: 2px; }

  /* COMPARISON ROW */
  .compare-row {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--gray-100);
    gap: 16px;
    transition: background .15s;
  }

  .compare-row:hover { background: var(--gray-50); }
  .compare-row.highlight { background: var(--green-bg); border-left: 3px solid var(--green); }

  .compare-pole-id {
    font-weight: 700;
    font-size: 15px;
    color: var(--navy);
    min-width: 60px;
  }

  .compare-detail { flex: 1; display: flex; gap: 24px; font-size: 13px; color: var(--gray-600); }

  /* NOTIFICATION */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy);
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    font-size: 14px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slideUp .3s ease;
    max-width: 360px;
  }

  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  .hidden { display: none !important; }

  /* INFO TOOLTIP POPUP ON MAP */
  .map-popup {
    position: absolute;
    background: white;
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    padding: 14px 18px;
    font-size: 13px;
    z-index: 20;
    min-width: 200px;
    border: 1px solid var(--gray-200);
  }

  .map-popup h4 { font-size: 15px; color: var(--navy); margin-bottom: 8px; }
  .map-popup .row { display: flex; justify-content: space-between; padding: 3px 0; }
  .map-popup .row .lbl { color: var(--gray-500); }
  .map-popup .row .val { font-weight: 600; color: var(--gray-800); }

  /* DATABASE TABLE AREA */
  .db-search {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
  }

  .db-search input {
    flex: 1;
    max-width: 300px;
  }

  /* WHY SECTION */
  .why-list { list-style: none; }
  .why-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 14px;
    color: var(--gray-700);
  }

  /* FINAL SCREEN */
  .final-screen {
    text-align: center;
    padding: 48px 24px;
  }

  .final-screen .tagline {
    font-size: 18px;
    color: var(--gray-600);
    margin-top: 8px;
    font-weight: 500;
  }

  .final-screen .flow-text {
    font-size: 15px;
    font-weight: 700;
    color: var(--blue);
    margin-top: 16px;
    letter-spacing: .5px;
  }

  .final-screen .loop-msg {
    font-size: 13px;
    color: var(--gray-500);
    margin-top: 12px;
    font-style: italic;
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
  }

  .wow-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 24px;
    text-align: left;
  }

  .wow-card {
    padding: 18px;
    border-radius: var(--radius);
    border: 1px solid var(--gray-200);
    background: white;
  }

  .wow-card .num { font-size: 11px; font-weight: 800; color: var(--blue); margin-bottom: 4px; }
  .wow-card h4 { font-size: 14px; color: var(--navy); margin-bottom: 4px; }
  .wow-card p { font-size: 12px; color: var(--gray-500); }

  /* SECTION BREAKS */
  .section-break {
    border: none;
    border-top: 1px solid var(--gray-200);
    margin: 24px 0;
  }

  .status-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
  }

function drawSiteImage(withDetections) {
  const canvas = document.getElementById('previewCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;

  // Draw background scene
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, w, h);

  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.55);
  skyGrad.addColorStop(0, '#6BB3E0');
  skyGrad.addColorStop(1, '#B5D8F0');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, w, h * 0.55);

  // Ground
  const gndGrad = ctx.createLinearGradient(0, h * 0.55, 0, h);
  gndGrad.addColorStop(0, '#8B9A6B');
  gndGrad.addColorStop(0.3, '#7A8B5C');
  gndGrad.addColorStop(1, '#6B7A4D');
  ctx.fillStyle = gndGrad;
  ctx.fillRect(0, h * 0.55, w, h * 0.45);

  // Road
  ctx.fillStyle = '#555';
  ctx.fillRect(0, h * 0.7, w, h * 0.08);
  ctx.strokeStyle = '#FFD700';
  ctx.setLineDash([15, 10]);
  ctx.beginPath();
  ctx.moveTo(0, h * 0.74);
  ctx.lineTo(w, h * 0.74);
  ctx.stroke();
  ctx.setLineDash([]);

  // Buildings in background
  ctx.fillStyle = '#9BA3AD';
  ctx.fillRect(20, h*0.35, 50, h*0.2);
  ctx.fillStyle = '#A8B0B8';
  ctx.fillRect(80, h*0.38, 40, h*0.17);
  ctx.fillStyle = '#8A929A';
  ctx.fillRect(400, h*0.32, 60, h*0.23);
  ctx.fillStyle = '#96A0AA';
  ctx.fillRect(470, h*0.36, 45, h*0.19);

  // Draw 3 poles
  drawPole(ctx, 150, h, 0.52, '#5C4033');  // Pole 1
  drawPole(ctx, 300, h, 0.50, '#5C4033');  // Pole 2
  drawPole(ctx, 450, h, 0.48, '#6B5040');  // Pole 3

  // Wires between poles
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(150, h * 0.18);
  ctx.quadraticCurveTo(225, h * 0.22, 300, h * 0.20);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(300, h * 0.20);
  ctx.quadraticCurveTo(375, h * 0.24, 450, h * 0.22);
  ctx.stroke();

  // Second wire set
  ctx.beginPath();
  ctx.moveTo(150, h * 0.21);
  ctx.quadraticCurveTo(225, h * 0.25, 300, h * 0.23);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(300, h * 0.23);
  ctx.quadraticCurveTo(375, h * 0.27, 450, h * 0.25);
  ctx.stroke();

  // Pole ID labels (barely visible to simulate real-world)
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillRect(140, h*0.42, 22, 14);
  ctx.fillStyle = '#333';
  ctx.font = '7px monospace';
  ctx.fillText('P-102', 141, h*0.42+10);

  ctx.fillStyle = 'rgba(255,255,255,0.4)'; // more faded
  ctx.fillRect(290, h*0.44, 22, 14);
  ctx.fillStyle = '#888';
  ctx.font = '6px monospace';
  ctx.fillText('P-1??', 291, h*0.44+10);

  // NSC site marker
  ctx.fillStyle = '#dc2626';
  ctx.beginPath();
  ctx.arc(230, h * 0.63, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = 'bold 9px sans-serif';
  ctx.fillText('NSC', 220, h * 0.66);

  // Trees
  drawTree(ctx, 510, h * 0.55);
  drawTree(ctx, 540, h * 0.57);
  drawTree(ctx, 35, h * 0.56);

  if (withDetections) {
    const boxes = [
      { x: 125, y: h*0.12, w: 52, h: h*0.56, color: '#22c55e', label: 'Pole 1 — 96%', id: 'P-102' },
      { x: 275, y: h*0.14, w: 52, h: h*0.54, color: '#3b82f6', label: 'Pole 2 — 89%', id: 'P-108' },
      { x: 425, y: h*0.16, w: 52, h: h*0.52, color: '#f59e0b', label: 'Pole 3 — 81%', id: 'P-115' },
    ];

    boxes.forEach(b => {
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 3]);
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.setLineDash([]);

      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y - 18, ctx.measureText(b.label).width + 14, 18);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText(b.label, b.x + 6, b.y - 5);
    });
  }

  // Watermark
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.font = '10px sans-serif';
  ctx.fillText('Site Photo — Sector 5 — Demo', 10, h - 8);
}

function drawPole(ctx, x, h, topRatio, color) {
  // Main pole
  ctx.fillStyle = color;
  ctx.fillRect(x - 4, h * topRatio * 0.35, 8, h - h * topRatio * 0.35 - h * 0.22);

  // Cross arm
  ctx.fillStyle = '#444';
  ctx.fillRect(x - 25, h * topRatio * 0.37, 50, 4);

  // Insulators
  ctx.fillStyle = '#888';
  [x-22, x-10, x+10, x+22].forEach(ix => {
    ctx.fillRect(ix-2, h * topRatio * 0.37 - 6, 4, 6);
  });
}

function drawTree(ctx, x, baseY) {
  ctx.fillStyle = '#3d6b35';
  ctx.beginPath();
  ctx.moveTo(x, baseY - 30);
  ctx.lineTo(x - 15, baseY);
  ctx.lineTo(x + 15, baseY);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#5C4033';
  ctx.fillRect(x - 3, baseY, 6, 12);
}

function runProcessingAnimation() {
  drawSiteImage(false);
  const steps = ['ps1','ps2','ps3','ps4','ps5'];
  let i = 0;

  function advance() {
    if (i >= steps.length) {
      // Done — show detections
      setTimeout(() => {
        drawSiteImage(true);
        showToast('3 poles detected ✓');
        setTimeout(() => showDetectionResults(), 800);
      }, 400);
      return;
    }

    const el = document.getElementById(steps[i]);
    if (!el) return;
    el.classList.remove('active');
    el.classList.add('done');
    el.querySelector('.icon').innerHTML = '✓';

    if (i === 1) drawSiteImage(true);

    i++;
    if (i < steps.length) {
      const next = document.getElementById(steps[i]);
      if (next) {
        next.classList.add('active');
        next.querySelector('.icon').innerHTML = '<div class="spinner"></div>';
      }
    }

    setTimeout(advance, 600);
  }

  setTimeout(advance, 700);
}

function renderMap(selectedPole, standalone) {
  const markerData = [
    { id:'P-102', x:38, y:52, color:'#22c55e', dist:'35 m' },
    { id:'P-108', x:55, y:38, color:'#3b82f6', dist:'52 m' },

    { id:'P-124', x:58, y:25, color:'#94a3b8', dist:'' },
    { id:'P-130', x:20, y:68, color:'#94a3b8', dist:'' },
  ];

  const nscMarker = { x: 45, y: 55 };

  let markersHTML = '';

  // Road lines
  const roads = `
    <div class="map-road" style="top:30%;left:0;width:100%;height:4px;transform:rotate(-5deg);"></div>
    <div class="map-road" style="top:50%;left:0;width:100%;height:3px;"></div>

    <div class="map-road" style="top:65%;left:0;width:100%;height:3px;transform:rotate(2deg);"></div>
  `;

  // NSC site
  markersHTML += `
    <div class="map-marker" style="left:${nscMarker.x}%;top:${nscMarker.y}%;">
      <div class="map-marker-label" style="background:var(--red);">📍 NSC Site</div>
      <div class="map-marker-dot" style="background:var(--red);width:20px;height:20px;"></div>
    </div>
  `;

  // Poles
  markerData.forEach(m => {
    const isCandidate = ['P-102','P-108','P-115'].includes(m.id);
    const isSelected = selectedPole === m.id;
    const size = isCandidate ? (isSelected ? '22px' : '16px') : '10px';
    const showLabel = isCandidate || standalone;
    markersHTML += `
      <div class="map-marker" style="left:${m.x}%;top:${m.y}%;" ${isCandidate?`onclick="showMapPopup('${m.id}',${m.x},${m.y})"`:''}  >
        ${showLabel ? `<div class="map-marker-label" style="${isSelected?'background:var(--green);':isCandidate?'':'background:var(--gray-500);'}">${m.id}${m.dist?' — '+m.dist:''}</div>` : ''}

      </div>
    `;
  });

  // Distance lines from NSC to candidates
  if (!standalone) {
    // SVG lines
    markersHTML += `
    <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;">
      <line x1="${nscMarker.x}%" y1="${nscMarker.y}%" x2="38%" y2="52%" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3" opacity=".6"/>
      <line x1="${nscMarker.x}%" y1="${nscMarker.y}%" x2="55%" y2="38%" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" opacity=".4"/>
      <line x1="${nscMarker.x}%" y1="${nscMarker.y}%" x2="70%" y2="60%" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" opacity=".3"/>

  const legend = `

}

function showMapPopup(poleId, x, y) {
  const p = POLES.find(pp => pp.id === poleId);
  const c = CANDIDATES.find(cc => cc.id === poleId);
  const popup = document.getElementById('mapPopup');
  if (!popup || !p) return;

  popup.innerHTML = `
    <h4>${p.id}</h4>
    <div class="row"><span class="lbl">Distance</span><span class="val">${c?c.distance+' m':'—'}</span></div>
    <div class="row"><span class="lbl">Transformer</span><span class="val">${p.transformer}</span></div>
    <div class="row"><span class="lbl">Feeder</span><span class="val">${p.feeder}</span></div>
    <div class="row"><span class="lbl">Available</span><span class="val">${p.availableCapacity} kVA</span></div>
    <div class="row"><span class="lbl">Status</span><span class="val">${p.status}</span></div>
  `;

  popup.style.left = Math.min(x + 5, 65) + '%';
  popup.style.top = Math.max(y - 25, 5) + '%';
  popup.classList.remove('hidden');

  setTimeout(() => {
    document.addEventListener('click', function handler(e) {
      if (!popup.contains(e.target)) {
        popup.classList.add('hidden');
        document.removeEventListener('click', handler);
      }
    });
  }, 100);
}

// ============ PAGE MANAGEMENT ============

function showPage(page) {
  const main = document.getElementById('mainContent');
  currentStep = 0;

  // Update nav
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.page === page);
  });

  switch(page) {
    case 'dashboard':
      main.innerHTML = dashboardHTML();
      break;
    case 'new-assessment':
      main.innerHTML = assessmentHTML();
      break;
    case 'pole-database':
      main.innerHTML = poleDatabaseHTML();
      break;
    case 'gis-map-page':
      main.innerHTML = gisMapPageHTML();
      break;
    case 'history':
      main.innerHTML = historyHTML();
      break;
  }

  scrollTop();
}

function scrollTop() {
  document.getElementById('mainContent').scrollTo({ top: 0, behavior: 'smooth' });
}

// Toast notification
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>✓</span> ${msg}`;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 3000);
}
</script>
